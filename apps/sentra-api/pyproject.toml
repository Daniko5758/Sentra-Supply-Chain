[project]
name = "sentra-api"
version = "0.1.0"
description = "SENTRA backend API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.43,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mock-s4",
    "pydantic-settings>=2.7,<3",
    "sap-ai-sdk-gen==7.4.1",
    "sqlalchemy>=2.0,<2.1",
    "starlette>=0.40,<1",
    "tzdata>=2024.1,<2027",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv.sources]
mock-s4 = { path = "../mock-s4", editable = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentra_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: numerical acceptance tests from RULES_AND_GOLDEN.md",
    "seed_file(name): run the test with SENTRA_SEED_FILE=<name> (DEC-035); default is the DEMO seed",
]
